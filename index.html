<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UX/UI: de la investigación al prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121316; --bg2:#1a1c21; --bg3:#22252b; --line:#2e3239;
  --text:#e9eaee; --muted:#a3a9b5;
  --magenta:#ff3d9a; --teal:#1fd1be; --orange:#ff9147; --graphite:#aab3c2;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
h1,h2,h3{font-family:'Syne',sans-serif;line-height:1.1;letter-spacing:-.01em}
.mono{font-family:'JetBrains Mono',monospace}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}

/* NAV */
nav.top{position:sticky;top:0;z-index:20;background:rgba(18,19,22,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav.top .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:16px}
.brand{font-family:'Syne',sans-serif;font-weight:800;text-decoration:none;font-size:18px;display:flex;align-items:center;gap:10px}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--magenta);box-shadow:16px 0 0 var(--teal),32px 0 0 var(--orange);margin-right:34px}
.links{display:flex;gap:4px;flex-wrap:wrap}
.links a{font-size:14px;text-decoration:none;color:var(--muted);padding:8px 12px;border-radius:8px;transition:.15s}
.links a:hover{color:var(--text);background:var(--bg3)}

/* HERO */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);
  background:
   linear-gradient(var(--line) 1px,transparent 1px) 0 0/48px 48px,
   linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/48px 48px,
   var(--bg)}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 20% 30%,rgba(255,61,154,.14),transparent 55%),radial-gradient(ellipse at 85% 70%,rgba(31,209,190,.12),transparent 55%);pointer-events:none}
.hero .wrap{position:relative;z-index:1;padding-top:88px;padding-bottom:72px}
.kicker{font-family:'JetBrains Mono',monospace;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-bottom:22px}
.hero h1{font-size:clamp(40px,7vw,84px);font-weight:800;max-width:15ch}
.hero h1 em{font-style:normal;color:var(--magenta)}
.hero p.lead{max-width:56ch;margin-top:24px;color:var(--muted);font-size:18px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;border:1px solid var(--line);transition:.15s;cursor:pointer;background:none;color:var(--text);font-family:inherit}
.btn.primary{background:var(--magenta);border-color:var(--magenta);color:#14060d}
.btn.primary:hover{filter:brightness(1.1)}
.btn:not(.primary):hover{background:var(--bg3)}
.stats{display:flex;gap:36px;flex-wrap:wrap;margin-top:54px}
.stat b{display:block;font-family:'Syne',sans-serif;font-size:34px;font-weight:800}
.stat span{font-size:13px;color:var(--muted)}
.track{display:flex;gap:6px;margin-top:44px;flex-wrap:wrap;max-width:640px}
.track a{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;text-decoration:none;color:#0d0e10;transition:.15s}
.track a:hover{transform:translateY(-3px)}
.track-cap{font-size:12.5px;color:var(--muted);margin-top:10px;font-family:'JetBrains Mono',monospace}

/* SECTIONS */
section.block{padding:84px 0;border-bottom:1px solid var(--line)}
.sec-head{display:flex;align-items:baseline;gap:16px;margin-bottom:12px}
.sec-head .n{font-family:'JetBrains Mono',monospace;color:var(--magenta);font-size:14px}
.sec-head h2{font-size:clamp(30px,4.5vw,48px);font-weight:800}
.sec-sub{color:var(--muted);max-width:62ch;margin-bottom:40px}

/* REGLAS */
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.rule{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.rule .ic{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--teal);margin-bottom:10px}
.rule h3{font-size:19px;margin-bottom:8px}
.rule p{color:var(--muted);font-size:15px}
.evalbox{margin-top:28px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.evalbox h3{font-size:20px;margin-bottom:16px}
.bar{display:flex;height:44px;border-radius:10px;overflow:hidden;gap:3px}
.bar div{display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#0d0e10;font-weight:500;min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:14px;font-size:14px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px}

/* CLASES */
.progress{display:flex;align-items:center;gap:14px;margin-bottom:34px;font-size:14px;color:var(--muted)}
.progress .pb{flex:1;max-width:320px;height:6px;border-radius:6px;background:var(--bg3);overflow:hidden}
.progress .pb i{display:block;height:100%;background:var(--teal);transition:width .3s}
.phase{margin-bottom:38px}
.phase h3{font-size:22px;display:flex;align-items:center;gap:12px;margin-bottom:6px}
.phase h3 i{width:12px;height:12px;border-radius:4px;display:inline-block}
.phase .pd{color:var(--muted);font-size:14.5px;margin-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{position:relative;display:block;text-decoration:none;background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:20px;transition:.18s;border-top:3px solid var(--c)}
.card:hover{background:var(--bg3);transform:translateY(-3px)}
.card .wk{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--c);display:flex;justify-content:space-between;gap:8px;margin-bottom:10px}
.card h4{font-family:'Syne',sans-serif;font-size:19px;line-height:1.2;margin-bottom:8px}
.card p{font-size:14px;color:var(--muted)}
.tag{font-family:'JetBrains Mono',monospace;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--c);color:#0d0e10;font-weight:500}
.done-mark{color:var(--teal)}

/* REFERENCIAS */
.refgroup{margin-bottom:30px}
.refgroup h3{font-size:20px;margin-bottom:14px}
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ref{display:block;text-decoration:none;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px 18px;transition:.15s}
.ref:hover{border-color:var(--teal);background:var(--bg3)}
.ref b{display:flex;justify-content:space-between;font-size:15.5px;margin-bottom:4px}
.ref b span{color:var(--teal);font-family:'JetBrains Mono',monospace}
.ref p{font-size:13.5px;color:var(--muted)}

/* BIBLIOGRAFIA */
.bib{list-style:none;display:grid;gap:0;border-top:1px solid var(--line)}
.bib li{padding:18px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:6px 24px}
.bib .t{font-family:'Syne',sans-serif;font-size:19px;font-weight:700}
.bib .a{color:var(--muted);font-size:14.5px}
.bib .w{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--orange);align-self:center;text-align:right}
@media(max-width:640px){.bib li{grid-template-columns:1fr}.bib .w{text-align:left}}

footer{padding:40px 0 60px;color:var(--muted);font-size:13.5px}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}

/* VISTA CLASE */
.crumbs{padding-top:28px;font-size:13.5px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.crumbs a{text-decoration:none}.crumbs a:hover{color:var(--text)}
.chead{padding:30px 0 40px;border-bottom:1px solid var(--line)}
.chead .big{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(70px,13vw,150px);line-height:.85;color:var(--c);opacity:.95}
.chead h1{font-size:clamp(32px,5vw,56px);font-weight:800;margin-top:10px}
.chead .meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.pill{font-family:'JetBrains Mono',monospace;font-size:12px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.c{background:var(--c);border-color:var(--c);color:#0d0e10;font-weight:500}
.cbody{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:40px;padding:44px 0 30px}
@media(max-width:900px){.cbody{grid-template-columns:1fr}}
.cb h2{font-size:15px;font-family:'JetBrains Mono',monospace;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--c);margin:34px 0 12px}
.cb h2:first-child{margin-top:0}
.obj{font-size:21px;font-family:'Syne',sans-serif;font-weight:500;line-height:1.35}
.cb ul{list-style:none;display:grid;gap:10px}
.cb li{padding:14px 16px 14px 44px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;position:relative;font-size:15.5px}
.cb li::before{content:"";position:absolute;left:18px;top:21px;width:10px;height:10px;border-radius:3px;background:var(--c)}
.deliv{background:var(--bg2);border:1px solid var(--c);border-radius:var(--radius);padding:20px;font-size:16px}
.aside .box{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.aside h3{font-size:16px;margin-bottom:12px}
.aside .box p{font-size:14.5px;color:var(--muted)}
.aside .res a{display:flex;justify-content:space-between;gap:10px;text-decoration:none;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.aside .res a:last-child{border-bottom:0}
.aside .res a:hover{color:var(--teal)}
.hito{border-color:var(--orange)!important}
.hito h3{color:var(--orange)}
.pager{display:flex;justify-content:space-between;gap:14px;padding:30px 0 70px;border-top:1px solid var(--line)}
.pager a{flex:1;max-width:48%;text-decoration:none;background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;transition:.15s}
.pager a:hover{background:var(--bg3);border-color:var(--c)}
.pager small{display:block;font-family:'JetBrains Mono',monospace;color:var(--muted);font-size:12px;margin-bottom:4px}
.pager .nx{text-align:right;margin-left:auto}
.pager b{font-family:'Syne',sans-serif;font-size:17px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
@media(max-width:700px){.links a{padding:8px 8px;font-size:13px}.brand i{display:none}.hero .wrap{padding-top:60px}}
</style>
</head>

 {n:15, t:'Pruebas de usabilidad', obj:'Evaluar el prototipo con usuarios reales, priorizar problemas y aplicar mejoras.',
  clase:['Planificación del test: tareas, escenario y métricas','Moderación y think-aloud','Métricas: éxito, tiempo, errores y escala SUS','Priorizar hallazgos por severidad'],

const RULES = [
 ['01','Metodología semanal','Cada semana combina 2 horas de clase (conceptos, explicación, demostraciones, ejercicios guiados y retroalimentación) con 4 horas de trabajo externo (investigación, aplicación de metodologías y avance del proyecto).'],
 ['02','Un proyecto continuo','Todo el curso gira alrededor de un mismo problema de diseño. Cada entregable semanal alimenta el siguiente, así que no hay trabajos aislados.'],
 ['03','Entregables semanales','El entregable de cada semana se sube antes de la siguiente clase, en el formato indicado en la ficha de la clase. Lo que no se entrega a tiempo se retroalimenta con menos profundidad.'],
 ['04','Bitácora del case study','Cada entregable se documenta como una sección del case study. Así, en la semana 16 solo se pule y se ensaya la presentación.'],
 ['05','Tres hitos con rúbrica','Semana 6 (investigación y problema), semana 11 (wireframes y dirección visual) y semana 14 (prototipo funcional). Cada hito se presenta y recibe retroalimentación con rúbrica.'],
 ['06','Trabajo con usuarios','Toda investigación se hace con consentimiento informado y datos anonimizados. Las grabaciones y notas se usan solo para el curso.'],
 ['07','Integridad y uso de IA','Se puede usar IA como apoyo para explorar o redactar, pero las entrevistas, los hallazgos y las decisiones de diseño deben ser propios. Declara dónde la usaste.'],
 ['08','Herramientas','Figma y FigJam como base. Se aceptan alternativas para investigación (Miro, Maze, Optimal Workshop) si el resultado es equivalente.']
];

 ['Hito 2',15,'#ff9147'],

];

/* ============ UTILIDADES ============ */
const $app = document.getElementById('app');
const phaseOf = n => PHASES.find(p => n >= p.range[0] && n <= p.range[1]);
let done = [];
try { done = JSON.parse(localStorage.getItem('ux-done') || '[]'); } catch(e) { done = []; }
function saveDone(){ try { localStorage.setItem('ux-done', JSON.stringify(done)); } catch(e){} }
const isDone = n => done.includes(n);

/* ============ VISTAS ============ */
function homeView(){
  const track = WEEKS.map(w => `<a href="#semana-${w.n}" style="background:${phaseOf(w.n).color}" title="Semana ${w.n}: ${w.t}" aria-label="Semana ${w.n}: ${w.t}">${w.n}</a>`).join('');
  const rules = RULES.map(r => `<div class="rule"><div class="ic">${r[0]}</div><h3>${r[1]}</h3><p>${r[2]}</p></div>`).join('');
  const bar = EVAL.map(e => `<div style="width:${e[1]}%;background:${e[2]}">${e[1]}%</div>`).join('');
  const legend = EVAL.map(e => `<span><i style="background:${e[2]}"></i>${e[0]}</span>`).join('');
  const phases = PHASES.map(p => {
    const cards = WEEKS.filter(w => phaseOf(w.n) === p).map(w => `
      <a class="card" href="#semana-${w.n}" style="--c:${p.color}">
        <div class="wk"><span>SEMANA ${String(w.n).padStart(2,'0')} ${isDone(w.n)?'<span class="done-mark">✓</span>':''}</span>${w.hito?'<span class="tag">HITO</span>':''}</div>
        <h4>${w.t}</h4>
        <p>${w.cs}</p>
      </a>`).join('');
    return `<div class="phase"><h3><i style="background:${p.color}"></i>${p.name} <span class="mono" style="font-size:13px;color:var(--muted);font-weight:400">sem. ${p.range[0]}–${p.range[1]}</span></h3><p class="pd">${p.desc}</p><div class="cards">${cards}</div></div>`;
  }).join('');
  const refs = REFS.map(g => `<div class="refgroup"><h3>${g.g}</h3><div class="refs">${g.items.map(i => `<a class="ref" href="${i[1]}" target="_blank" rel="noopener"><b>${i[0]}<span>↗</span></b><p>${i[2]}</p></a>`).join('')}</div></div>`).join('');
  const bib = BIB.map(b => `<li><div><div class="t">${b[1]}</div><div class="a">${b[0]} · ${b[2]}</div></div><div class="w">${b[3]}</div></li>`).join('');

  return `
  <header class="hero" id="inicio">
    <div class="wrap">
      <div class="kicker">Ingeniería Multimedia · Universidad San Buenaventura</div>
      <h1>UX/UI: de la <em>investigación</em> al prototipo</h1>
      <p class="lead">Un curso de 16 semanas donde cada clase construye sobre la anterior: entiendes al usuario, defines el problema, diseñas en Figma, pruebas y cuentas todo el proceso como un case study.</p>
      <div class="cta">
        <a class="btn primary" href="#semana-1">Empezar con la semana 1 →</a>
        <a class="btn" href="#clases">Ver todas las clases</a>
      </div>
      <div class="stats">
        <div class="stat"><b>16</b><span>semanas</span></div>
        <div class="stat"><b>2 h</b><span>de clase a la semana</span></div>
        <div class="stat"><b>4 h</b><span>de trabajo externo</span></div>
        <div class="stat"><b>3</b><span>hitos con rúbrica</span></div>
      </div>
      <div class="track" role="navigation" aria-label="Acceso rápido a las semanas">${track}</div>
      <div class="track-cap">acceso rápido · cada color es una fase del proceso</div>
    </div>
  </header>

  <section class="block" id="reglas"><div class="wrap">
    <div class="sec-head"><span class="n">01</span><h2>Reglas</h2></div>
    <p class="sec-sub">Cómo funciona el curso, qué se espera de cada semana y cómo se evalúa.</p>
    <div class="rules">${rules}</div>
    <div class="evalbox">
      <h3>Distribución de la evaluación</h3>
      <div class="bar" role="img" aria-label="Distribución de la evaluación">${bar}</div>
      <div class="legend">${legend}</div>
    </div>
  </div></section>

  <section class="block" id="clases"><div class="wrap">
    <div class="sec-head"><span class="n">02</span><h2>Clases</h2></div>
    <p class="sec-sub">Las 16 semanas agrupadas por fase. Entra a cada una para ver el objetivo, lo que se trabaja en clase, el trabajo externo y el entregable.</p>
    <div class="progress"><span id="pg-text">${done.length} de 16 vistas</span><div class="pb"><i style="width:${done.length/16*100}%"></i></div></div>
    ${phases}
  </div></section>

  <section class="block" id="referencias"><div class="wrap">
    <div class="sec-head"><span class="n">03</span><h2>Referencias prácticas</h2></div>
    <p class="sec-sub">Herramientas, guías y recursos que usarás durante el curso. Se abren en una pestaña nueva.</p>
    ${refs}
  </div></section>

  <section class="block" id="bibliografia" style="border-bottom:0"><div class="wrap">
    <div class="sec-head"><span class="n">04</span><h2>Bibliografía</h2></div>
    <p class="sec-sub">Lecturas base del curso, con las semanas en que más se aprovechan.</p>
    <ul class="bib">${bib}</ul>
  </div></section>`;
}

function weekView(n){
  const w = WEEKS.find(x => x.n === n);
  if(!w) return homeView();
  const p = phaseOf(n);
  const prev = WEEKS.find(x => x.n === n-1), next = WEEKS.find(x => x.n === n+1);
  const li = a => a.map(i => `<li>${i}</li>`).join('');
  const res = w.res.map(r => r[1].startsWith('#')
    ? `<a href="${r[1]}"><span>${r[0]}</span><span class="mono">→</span></a>`
    : `<a href="${r[1]}" target="_blank" rel="noopener"><span>${r[0]}</span><span class="mono">↗</span></a>`).join('');
  return `
  <div style="--c:${p.color}">
    <div class="wrap">
      <div class="crumbs"><a href="#inicio">Inicio</a> / <a href="#clases">Clases</a> / Semana ${n}</div>
      <div class="chead">
        <div class="big">${String(n).padStart(2,'0')}</div>
        <h1>${w.t}</h1>
        <div class="meta">
          <span class="pill c">${p.name}</span>
          <span class="pill">2 h clase</span>
          <span class="pill">4 h trabajo externo</span>
          ${w.hito?`<span class="pill" style="border-color:var(--orange);color:var(--orange)">${w.hito}</span>`:''}
        </div>
      </div>
      <div class="cbody">
        <div class="cb">
          <h2>Objetivo</h2>
          <p class="obj">${w.obj}</p>
          <h2>En clase (2 h)</h2>
          <ul>${li(w.clase)}</ul>
          <h2>Trabajo externo (4 h)</h2>
          <ul>${li(w.ext)}</ul>
          <h2>Entregable</h2>
          <div class="deliv">${w.ent}</div>
        </div>
        <aside class="aside">
          <div class="box"><h3>Case study</h3><p>${w.cs}</p></div>
          <div class="box res"><h3>Recursos de la semana</h3>${res}</div>
          <button class="btn ${isDone(n)?'':'primary'}" id="markbtn" style="width:100%;justify-content:center">${isDone(n)?'✓ Marcada como vista':'Marcar como vista'}</button>
        </aside>
      </div>
      <div class="pager">
        ${prev?`<a href="#semana-${prev.n}"><small>← SEMANA ${prev.n}</small><b>${prev.t}</b></a>`:'<span></span>'}
        ${next?`<a class="nx" href="#semana-${next.n}"><small>SEMANA ${next.n} →</small><b>${next.t}</b></a>`:`<a class="nx" href="#inicio"><small>FIN DEL CURSO</small><b>Volver al inicio</b></a>`}
      </div>
    </div>
  </div>`;
}

/* ============ RUTEO POR HASH ============ */
const HOME_SECTIONS = ['inicio','reglas','clases','referencias','bibliografia'];
let currentView = null;

function route(){
  const h = location.hash.slice(1);
  const m = h.match(/^semana-(\d{1,2})$/);
  if(m && WEEKS.some(w => w.n === +m[1])){
    const n = +m[1];
    $app.innerHTML = weekView(n);
    currentView = 'semana-' + n;
    document.title = `Semana ${n} · ${WEEKS[n-1].t} — UX/UI`;
    window.scrollTo(0,0);
    wireMark(n);
    return;
  }
  const target = HOME_SECTIONS.includes(h) ? h : 'inicio';
  if(currentView !== 'home'){
    $app.innerHTML = homeView();
    currentView = 'home';
    document.title = 'UX/UI: de la investigación al prototipo';
  }
  const el = document.getElementById(target);
  if(el && target !== 'inicio') el.scrollIntoView(); else window.scrollTo(0,0);
}
function wireMark(n){
  document.getElementById('markbtn').addEventListener('click', () => {
    done = isDone(n) ? done.filter(x => x !== n) : [...done, n];
    saveDone();
    const y = window.scrollY;
    $app.innerHTML = weekView(n);
    window.scrollTo(0, y);
    wireMark(n);
  });
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
